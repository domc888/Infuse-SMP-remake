prefix: "&dInfuse &7» "

# Vanilla brewing stands are replaced by the Infuse crafting menu.
brewing-enabled: false

# ============================ CRAFTING GUI ============================
gui:
  # Title of the menu opened by right-clicking a brewing stand.
  title: "&dInfuse Crafting"
  # Material of the panes framing the menu (any stained glass pane works).
  pane-material: WHITE_STAINED_GLASS_PANE

# ============================== RITUALS ===============================
ritual:
  # How long a ritual lasts (minutes) before the augmented effect appears.
  minutes: 15
  # The Augmented Ender ritual takes a full hour (like the real Infuse SMP).
  minutes-ender: 60
  # After the augmented ritual, each effect can be crafted this many times.
  regular-per-effect: 3
  bossbar:
    # Show a countdown bossbar to everyone while a ritual is active.
    enabled: true
    # BossBar colors: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: PURPLE
    # Placeholders: %effect% %time% (mm:ss remaining) %minutes% %x% %y% %z%
    title: "&6&lRITUAL &d%effect% &7- &f%time% &7remaining"

# ============================= COOLDOWNS ==============================
cooldowns:
  speed: 20
  fire: 60
  invisibility: 90
  thunder: 120
  regeneration: 60
  frost: 90
  feather: 60
  haste: 60
  strength: 60
  heart: 120
  ender: 60
  emerald: 60
  ocean: 60

# Materials consumed per craft. Format: MATERIAL:amount
recipes:
  speed:
    - SUGAR:16
    - FEATHER:4
  fire:
    - BLAZE_POWDER:16
    - MAGMA_CREAM:4
  invisibility:
    - FERMENTED_SPIDER_EYE:8
    - GLASS:16
  thunder:
    - COPPER_INGOT:16
    - NETHER_STAR:1
  regeneration:
    - GHAST_TEAR:8
    - GOLDEN_APPLE:2
  frost:
    - ICE:16
    - DIAMOND:2
  feather:
    - FEATHER:16
    - PHANTOM_MEMBRANE:4
  haste:
    - REDSTONE:32
    - GOLD_INGOT:8
  strength:
    - BLAZE_ROD:8
    - NETHER_WART:16
  heart:
    - DIAMOND_BLOCK:2
    - GOLDEN_APPLE:4
  ender:
    - ENDER_PEARL:16
    - CHORUS_FRUIT:8
  emerald:
    - EMERALD:8
    - EXPERIENCE_BOTTLE:16
  ocean:
    - HEART_OF_THE_SEA:1
    - PRISMARINE_SHARD:16


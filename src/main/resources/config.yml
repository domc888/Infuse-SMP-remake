  spark-used: "&aYou used your %effect% spark!"
  no-materials: "&cMissing materials: %list%"
  crafted: "&aYou crafted %effect%! It was crafted at &f%x% %y% %z% &ain %world%&a."
  broadcast-craft: "&d%player% &7crafted %effect% &7at &f%x% %y% %z% &7in %world%&7!"
  ritual-start: "&6&lRITUAL STARTED! &d%player% &7began crafting %effect% &7at &f%x% %y% %z%&7. It completes in %minutes% minutes."
  ritual-done: "&6&lRITUAL COMPLETE! &f%effect% &6is waiting at &f%x% %y% %z% &6in %world%&6. First to grab it keeps it!"
  uncraftable: "&c%effect% can no longer be crafted this season."

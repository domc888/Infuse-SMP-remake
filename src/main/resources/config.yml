lang: en_US
allow_infinite_effects: false
empty_effect_icon: true
player_head_drops: true
brewing_gui: true

# Effect recipes can be edited in recipes.yml from your server panel.
# If enabled, custom infusions can only be crafted from the brewing-stand crafting interface.
crafting:
  require-brewing-stand: true

# Infusion bottles use the normal potion drink interaction to equip.
# protect-from-fire/explosions keeps dropped infusion items from being destroyed by the matching damage.
items:
  equip-on-consume: true
  sneak-equip: false
  protect-from-fire: true
  protect-from-explosions: true

# Season 2 permits any two effects. Set enforce-role-slots: true for one support and one primary.
# If both slots are full, drinking an infusion can return slot 2's old bottle before replacing it.
settings:
  enforce-role-slots: false
  replace-second-on-consume: true

drop_on_natural_death: true
rituals:
  duration: 600
  ender_duration: 3600
  broadcast_regular: true
  send_webhooks: false
  webhook_url: ""
  beacon: true
  immortal_brewing_stands: true
# Supported modes: random, prefer_1, prefer_2, prefer_augmented, only_1, only_2, both, none.
effect_drops: prefer_augmented
hit_counter_decay_seconds: 15
join_effects_enabled: false
join_effects: [ocean, emerald, fire, speed]
betterteams:
  enabled: false
  trust_allies: false
craft_limits:
  emerald: [1, 3]
  ender: [1, 3]
  feather: [1, 3]
  fire: [1, 3]
  frost: [1, 3]
  haste: [1, 3]
  heart: [1, 3]
  invis: [1, 3]
  ocean: [1, 3]
  regen: [1, 3]
  speed: [1, 3]
  strength: [1, 3]
  thunder: [1, 3]
  apophis: [1, 3]
  thief: [1, 3]
emerald:
  cooldown: {default: 91, augmented: 46}
  duration: {default: 30, augmented: 35}
  passive: {xp_stolen_per_hit: 15, xp_stolen_percent: 1, percent_xp_to_share: 0.5, lock_duration_seconds: 10, looting_level: 5, xp_multiplier: 2}
  spark: {xp_multiplier: 4}
ender:
  enabled: false # not part of the 12-effect Season 1 set
  cooldown: {default: 60, augmented: 30}
  duration: {default: 15, augmented: 20}
  passive: {radius: 10}
  spark: {max_distance: 15}
feather:
  cooldown: {default: 63, augmented: 32}
  duration: {default: 2, augmented: 2}
  land: {radius: 4, damage: 8}
fire:
  cooldown: {default: 66, augmented: 33}
  duration: {default: 5, augmented: 6}
  passive: {lava_walk_speed: 0.6}
  spark: {radius: 5, explosion_radius: 5}
frost:
  cooldown: {default: 121, augmented: 61}
  duration: {default: 15, augmented: 20}
  passive: {snow_changing_radius: 3, powdered_snow_walk_speed: 0.6}
  spark: {radius: 5}
haste:
  cooldown: {default: 76, augmented: 38}
  duration: {default: 15, augmented: 20}
  passive: {fortune_level: 5, efficiency_level: 10, unbreaking_level: 5}
heart:
  cooldown: {default: 181, augmented: 91}
  duration: {default: 60, augmented: 80}
invis:
  hide_kills: false
  hide_deaths: false
  cooldown: {default: 121, augmented: 61}
  duration: {default: 20, augmented: 25}
ocean:
  cooldown: {default: 76, augmented: 38}
  duration: {default: 15, augmented: 20}
  passive: {drown_strength: 5, drown_damage: 1, drown_radius: 5, drown_interval: 1}
  spark: {drown_strength: 20, drown_damage: 2, drown_radius: 5, drown_interval: 1, pull_interval: 20, pull_radius: 5, pull_strength: 0.3}
regen:
  cooldown: {default: 91, augmented: 46}
  duration: {default: 15, augmented: 30}
  spark: {heal_trusted_radius: 5}
speed:
  cooldown: {default: 21, augmented: 11}
  duration: {default: 1, augmented: 1}
  spark: {dash_multiplier: 2, player_velocity_multiplier: 2}
strength:
  cooldown: {default: 91, augmented: 46}
  duration: {default: 15, augmented: 20}
thunder:
  cooldown: {default: 81, augmented: 41}
  duration: {default: 10, augmented: 10}
  spark: {base_radius: 10, per_player_boost_radius: 0.3, strikes_per_player: 3}
apophis:
  enabled: false
  cooldown: {default: 125, augmented: 63}
  duration: {default: 15, augmented: 18}
  passive: {xp_stolen_per_hit: 15, xp_stolen_percent: 1, percent_xp_to_share: 0.5, lock_duration_seconds: 10, looting_level: 5, lava_walk_speed: 0.6, xp_multiplier: 2}
  spark: {radius: 5, explosion_radius: 5, xp_multiplier: 4}
thief:
  enabled: false
  cooldown: {default: 300, augmented: 150}
  duration: {default: 10, augmented: 10}
# Text shown on infusion bottle tooltips and in /infuses; safe to edit from the panel.
effect_info:
  emerald:
    - "Passive: increased loot, Luck, extra experience, and better enchanting."
    - "Spark: powerful Hero of the Village and a temporary experience boost."
  ender:
    - "Passive: reveal nearby untrusted players and spread damage between cursed targets."
    - "Spark: teleport to your aim point and curse nearby enemies."
  feather:
    - "Passive: prevent fall damage and empower attacks after a high fall."
    - "Spark: launch upward, then slam back down."
  fire:
    - "Passive: fire resistance and improved safety while in lava."
    - "Spark: ignite nearby enemies."
  frost:
    - "Passive: move faster on ice and snow, and freeze targets."
    - "Spark: hinder nearby enemies and freeze them on hit."
  haste:
    - "Passive: stronger pickaxe enchantments."
    - "Spark: attack faster for a short time."
  heart:
    - "Passive: extra health and stronger food effects."
    - "Spark: heal nearby players."
  invis:
    - "Passive: stay hidden and avoid mob targeting."
    - "Spark: hide allies and blind enemies in the area."
  ocean:
    - "Passive: move and breathe better underwater; affect nearby enemies."
    - "Spark: create a powerful water vortex."
  regen:
    - "Passive: regenerate, resist hunger, and heal on hits."
    - "Spark: share healing with nearby teammates."
  speed:
    - "Passive: speed builds as you attack."
    - "Spark: dash forward."
  strength:
    - "Passive: increase damage and weaken shields."
    - "Spark: make your attacks critical for a short time."
  thunder:
    - "Passive: chain lightning and lightning tridents."
    - "Spark: strike enemies and summon a thunderstorm."
  apophis:
    - "Combines abilities from Fire, Emerald, and Heart."
    - "Spark: combine their sparks and blind players on hit."
  thief:
    - "Passive: disguise yourself and hide your name."
    - "Spark: temporarily steal an opponent's effect."

config_version: 1.1

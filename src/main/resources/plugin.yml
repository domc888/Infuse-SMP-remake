name: Infuse
version: '2.4.5-remake'
main: com.infuse.InfusePlugin
api-version: '1.21'
authors: [domc888]
commands:
  infuse:
    description: Main Infuse menu and admin commands.
    usage: /infuse <gui|recipes|reload|giveEffect|setEffect>
  infuses:
    description: Browse the available infusion effects.
    usage: /infuses
  effects:
    description: Browse the available infusion effects.
    usage: /effects
  recipes:
    description: Browse infusion recipes.
    usage: /recipes
  craftedeffects:
    description: Show how many effects you have crafted.
    usage: /craftedeffects
  augments:
    description: Open the augmented effects GUI.
    usage: /augments
  giveselector:
    description: Give an effect selector item to a player or all online players.
    usage: /giveselector <player|@a|*>
    permission: infuse.commands.infuse.giveEffect
  whohaseffect:
    description: List online players holding an effect.
    usage: /whohaseffect <effect>
    permission: infuse.commands.infuse.whoHasEffect
  give_effects:
    description: Give a player one or all infusion items.
    usage: /give_effects <player> [effect]
  start_ritual:
    description: Start an administrative effect ritual.
    usage: /start_ritual <effect>
  reloadtrust:
    description: Reload player and trust data from data.yml.
    usage: /reloadtrust
  lspark:
    description: Activates the first ability.
    usage: /lspark
  rspark:
    description: Activates the second ability.
    usage: /rspark
  ldrain:
    description: Drains the first ability.
    usage: /ldrain
  rdrain:
    description: Drains the second ability.
    usage: /rdrain
  swap:
    description: Swaps effects between slots.
    usage: /swap
  controls:
    description: Changes activation mode.
    usage: /controls [offhand|command]
  trust:
    description: Trust a player.
    usage: /trust <player>
  untrust:
    description: Untrust a player.
    usage: /untrust <player>
  cleareffects:
    description: Clears a player's effects.
    usage: /cleareffects <player>
  cleareffect:
    description: Alias for cleareffects.
    usage: /cleareffect <player>
  cooldown:
    description: Resets a player's cooldowns.
    usage: /cooldown <player>
permissions:
  infuse.commands.infuse.gui:
    default: op
  infuse.commands.infuse.reload:
    default: op
  infuse.commands.infuse.reroll:
    default: op
  infuse.commands.infuse.recipes:
    default: true
  infuse.commands.infuse.giveEffect:
    default: op
  infuse.commands.infuse.setEffect:
    default: op
  infuse.commands.infuse.clearEffects:
    default: op
  infuse.commands.infuse.getTrusted:
    default: true
  infuse.commands.infuse.cooldown:
    default: op
  infuse.commands.infuse.controls:
    default: true
  infuse.commands.infuse.startRitual:
    default: op
  infuse.commands.infuse.whoHasEffect:
    default: op
  infuse.commands.drain:
    default: true
  infuse.commands.draw:
    default: true
  infuse.commands.spark:
    default: true
  infuse.commands.swap:
    default: true
  infuse.commands.trust:
    default: true
